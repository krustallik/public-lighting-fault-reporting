name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck test sources
        working-directory: frontend
        run: npm run typecheck:tests
      - name: Run frontend unit and component tests
        working-directory: frontend
        run: npm run test
      - name: Generate frontend coverage
        working-directory: frontend
        run: npm run coverage
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: ci_test
      DB_USER: ci_test
      DB_PASSWORD: ci_test
      P2C_POSTGRES_INTEGRATION: 'true'
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_test
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Set up pinned Python toolchain for offline boundary validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.2'
      - name: Install hash-locked geodata toolchain
        working-directory: backend
        run: python -m pip install --require-hashes -r tools/geodata-requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Regenerate and check the offline Košice service-area artifacts
        working-directory: backend
        env:
          PROJ_NETWORK: 'OFF'
        run: npm run check:service-area
      - name: Initialize the disposable PostgreSQL 16 schema for integration tests
        working-directory: backend
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import pg from 'pg';

          const client = new pg.Client({
            host: process.env.DB_HOST,
            port: Number(process.env.DB_PORT),
            database: process.env.DB_NAME,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
          });
          await client.connect();
          try {
            await client.query(readFileSync('../database/schema.sql', 'utf8'));
            console.log('PostgreSQL 16 schema initialized in the CI-only database.');
          } finally {
            await client.end();
          }
          NODE
      - name: Typecheck test sources
        working-directory: backend
        run: npm run typecheck:tests
      - name: Run backend unit tests
        working-directory: backend
        run: npm run test
      - name: Generate backend coverage
        working-directory: backend
        run: npm run coverage
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: warn
          retention-days: 14

  sqlfluff:
    name: sqlfluff-report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned SQLFluff
        run: python -m pip install --disable-pip-version-check 'sqlfluff==4.4.0'
      - name: Lint SQL without auto-fix
        run: |
          mapfile -d '' sql_files < <(find database backend/src/db/migrations -type f -name '*.sql' -print0)
          if ((${#sql_files[@]} == 0)); then
            echo 'No SQL files found.' | tee "$RUNNER_TEMP/sqlfluff-lint.txt"
            exit 2
          fi
          status=0
          sqlfluff lint --ignore-local-config --config .sqlfluff "${sql_files[@]}" > "$RUNNER_TEMP/sqlfluff-lint.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/sqlfluff-lint.txt"
          printf '\nSQLFluff exit code: %s\n' "$status" | tee -a "$RUNNER_TEMP/sqlfluff-lint.txt"
          if ((status > 1)); then
            echo 'SQLFluff execution/configuration failure.'
            exit "$status"
          fi
          if ((status == 1)); then
            echo 'SQLFluff rule findings are informational pending baseline triage.'
          fi
      - name: Upload SQLFluff report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlfluff-report
          path: ${{ runner.temp }}/sqlfluff-lint.txt
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: dependency-audit-report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Collect npm audit reports without changing dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/npm-audit"
          set +e
          (cd frontend && npm audit --json > "$RUNNER_TEMP/npm-audit/frontend.json" 2> "$RUNNER_TEMP/npm-audit/frontend.stderr.txt")
          frontend_status=$?
          (cd backend && npm audit --json > "$RUNNER_TEMP/npm-audit/backend.json" 2> "$RUNNER_TEMP/npm-audit/backend.stderr.txt")
          backend_status=$?
          set -e
          printf '{"frontend_exit_code":%s,"backend_exit_code":%s}\n' "$frontend_status" "$backend_status" > "$RUNNER_TEMP/npm-audit/exit-codes.json"
          {
            echo '## npm audit (informational)'
            echo "Frontend exit code: $frontend_status"
            echo "Backend exit code: $backend_status"
            echo 'See the `dependency-audit-report` artifact. Findings do not fail this job until security triage defines a blocking policy.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'npm audit reports collected; no dependency or lockfile changes made.'
      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-report
          path: ${{ runner.temp }}/npm-audit/
          if-no-files-found: warn
          retention-days: 14

  process-egress-research:
    name: process-egress-research
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Resolve the synthetic probe host before isolation
        run: |
          probe_ip="$(getent ahostsv4 example.com | awk 'NR == 1 { print $1 }')"
          test -n "$probe_ip"
          printf 'PROBE_IPV4=%s\n' "$probe_ip" >> "$GITHUB_ENV"
          printf 'CHROME_BIN=%s\n' "$(command -v google-chrome || command -v google-chrome-stable)" >> "$GITHUB_ENV"
      - name: Characterize runner privileges before containment
        env:
          RUNNER_PRIVILEGE_EVIDENCE: ${{ runner.temp }}/runner-privilege-evidence.txt
        run: |
          bash scripts/research/characterize-runner-privileges.sh
      - name: Prove process egress isolation under a privilege-dropped identity
        env:
          PROCESS_EGRESS_EVIDENCE_DIR: ${{ runner.temp }}/process-egress-containment-evidence
        run: |
          sudo -n stat -c 'root-readable helper mode=%a owner=%U:%G path=%n' "$GITHUB_WORKSPACE/scripts/research/contained-workload.sh"
          sudo -n head -n 1 "$GITHUB_WORKSPACE/scripts/research/contained-workload.sh"
          sudo --preserve-env=PROBE_IPV4,CHROME_BIN,PROCESS_EGRESS_EVIDENCE_DIR,RUNNER_OS,RUNNER_TEMP,GITHUB_WORKSPACE,RUNNER_HOST_PID,HOST_NETNS_ID,HOST_USERNS_ID,PATH,CI \
            bash -x "$GITHUB_WORKSPACE/scripts/research/contained-workload.sh" probe
      - name: Upload process egress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: process-egress-research
          path: |
            ${{ runner.temp }}/runner-privilege-evidence.txt
            ${{ runner.temp }}/process-egress-containment-evidence/
          if-no-files-found: warn
          retention-days: 14

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-24.04
    needs: [process-egress-research]
    if: always()
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Report blocked browser run when the process-egress gate fails
        if: needs.process-egress-research.result != 'success'
        run: |
          echo 'BROWSER E2E BLOCKED — PROCESS EGRESS GATE FAILED: privilege-resistant containment was not demonstrated.'
          exit 1
      - name: Checkout
        if: needs.process-egress-research.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 20
        if: needs.process-egress-research.result == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install frontend dependencies
        if: needs.process-egress-research.result == 'success'
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        if: needs.process-egress-research.result == 'success'
        working-directory: backend
        run: npm ci
      - name: Install Playwright Chromium before network isolation
        if: needs.process-egress-research.result == 'success'
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: npx playwright install chromium
      - name: Resolve the synthetic probe host before isolation
        if: needs.process-egress-research.result == 'success'
        run: |
          probe_ip="$(getent ahostsv4 example.com | awk 'NR == 1 { print $1 }')"
          test -n "$probe_ip"
          printf 'PROBE_IPV4=%s\n' "$probe_ip" >> "$GITHUB_ENV"
          printf 'CHROME_BIN=%s\n' "$(command -v google-chrome || command -v google-chrome-stable)" >> "$GITHUB_ENV"
      - name: Characterize this runner before dropping to the E2E workload identity
        if: needs.process-egress-research.result == 'success'
        env:
          RUNNER_PRIVILEGE_EVIDENCE: ${{ runner.temp }}/browser-runner-privilege-evidence.txt
        run: bash scripts/research/characterize-runner-privileges.sh
      - name: Reprove privilege-resistant isolation and run browser E2E in that containment
        if: needs.process-egress-research.result == 'success'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          PROCESS_EGRESS_EVIDENCE_DIR: ${{ runner.temp }}/browser-egress-containment-evidence
        run: |
          sudo --preserve-env=PROBE_IPV4,CHROME_BIN,PROCESS_EGRESS_EVIDENCE_DIR,RUNNER_OS,RUNNER_TEMP,GITHUB_WORKSPACE,RUNNER_HOST_PID,HOST_NETNS_ID,HOST_USERNS_ID,PATH,CI,PLAYWRIGHT_BROWSERS_PATH \
            bash "$GITHUB_WORKSPACE/scripts/research/contained-workload.sh" browser
      - name: Upload synthetic browser, axe, request-ledger, trace, and egress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
            ${{ runner.temp }}/browser-egress-containment-evidence/
            ${{ runner.temp }}/browser-runner-privilege-evidence.txt
          if-no-files-found: warn
          retention-days: 14
