name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Require a clean production runtime dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Typecheck test sources
        working-directory: frontend
        run: npm run typecheck:tests
      - name: Run frontend unit and component tests
        working-directory: frontend
        run: npm run test
      - name: Generate frontend coverage
        working-directory: frontend
        run: npm run coverage
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_MAP_TILE_PROVIDER: carto
          VITE_CARTO_TILES_APPROVED: 'true'
          VITE_CARTO_PUBLIC_KEY: synthetic-ci-public-key
        run: npm run build
      - name: Build separate production public static image with synthetic CARTO key
        run: >-
          docker build --file frontend/Dockerfile.production --target public-runtime
          --tag production-foundation-public:${{ github.sha }}
          --build-arg VITE_CARTO_PUBLIC_KEY=synthetic-ci-public-key
          --build-arg PUBLIC_BUILD_ID=${{ github.sha }} .
      - name: Build separate production admin static image without CARTO key
        run: >-
          docker build --file frontend/Dockerfile.production --target admin-runtime
          --tag production-foundation-admin:${{ github.sha }}
          --build-arg ADMIN_BUILD_ID=${{ github.sha }} .
      - name: Build production Nginx edge image
        run: >-
          docker build --file frontend/Dockerfile.edge
          --tag production-foundation-edge:${{ github.sha }} .
      - name: Smoke-test production Nginx host routing and API boundaries
        env:
          NGINX_SMOKE_EDGE_IMAGE: production-foundation-edge:${{ github.sha }}
          NGINX_SMOKE_PUBLIC_IMAGE: production-foundation-public:${{ github.sha }}
          NGINX_SMOKE_ADMIN_IMAGE: production-foundation-admin:${{ github.sha }}
        run: bash scripts/production/nginx-static-smoke.sh
      - name: Validate production Compose ports, networks, and secret boundaries
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          for secret in db-admin db-runtime db-migration db-bootstrap jwt geoapify; do
            : > "$temp_dir/$secret"
          done
          cat > "$temp_dir/compose.env" <<EOF
          DB_NAME=lighting_foundation_ci_test
          DB_ADMIN_USER=lighting_dba
          DB_ADMIN_PASSWORD_FILE=$temp_dir/db-admin
          DB_RUNTIME_PASSWORD_FILE=$temp_dir/db-runtime
          DB_MIGRATION_PASSWORD_FILE=$temp_dir/db-migration
          DB_BOOTSTRAP_PASSWORD_FILE=$temp_dir/db-bootstrap
          JWT_SECRET_FILE=$temp_dir/jwt
          GEOAPIFY_API_KEY_FILE=$temp_dir/geoapify
          VITE_CARTO_PUBLIC_KEY=synthetic-ci-public-key
          APP_BUILD_SHA=${{ github.sha }}
          EOF
          docker compose --env-file "$temp_dir/compose.env" -f docker-compose.production.yml --profile release --profile bootstrap config --format json > "$temp_dir/compose.json"
          node scripts/production/check-compose-topology.mjs "$temp_dir/compose.json"
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: p3_ci_test
      DB_USER: ci_test
      DB_PASSWORD: ci_test
      P2C_POSTGRES_INTEGRATION: 'true'
      P3_POSTGRES_INTEGRATION: 'true'
      PRODUCTION_FOUNDATION_POSTGRES: 'true'
      PHASE_B_BACKUP_POSTGRES: 'true'
    defaults:
      run:
        shell: bash
    services:
      postgis:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        env:
          POSTGRES_DB: p3_ci_test
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d p3_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Set up pinned Python toolchain for offline boundary validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.2'
      - name: Install hash-locked geodata toolchain
        working-directory: backend
        run: python -m pip install --require-hashes -r tools/geodata-requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install PostgreSQL 16 client for backup-role permission probe
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-client-16
          pg_dump --version | grep -E ' 16\.'
      - name: Install checksum-pinned age v1.3.2 for offline backup integration tests
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/age-v1.3.2-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz \
            --output "$archive"
          echo 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  '"$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/age-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age-bin/age"
          install -m 0755 "$RUNNER_TEMP/age/age-keygen" "$RUNNER_TEMP/age-bin/age-keygen"
          echo "$RUNNER_TEMP/age-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/age-bin:$PATH"
          age --version | grep -F 'v1.3.2'
          age-keygen -o "$RUNNER_TEMP/age-check-identity" >/dev/null
          age-keygen -y "$RUNNER_TEMP/age-check-identity" | grep -E '^age1[a-z0-9]{58}$'
          rm -f "$RUNNER_TEMP/age-check-identity"
      - name: Require a clean production runtime dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Regenerate and check the offline Košice service-area artifacts
        working-directory: backend
        env:
          PROJ_NETWORK: 'OFF'
        run: npm run check:service-area
      - name: Verify empty-database preflight
        working-directory: backend
        run: npm run db:preflight:p3
      - name: Run canonical PostGIS migrations
        working-directory: backend
        run: npm run db:migrate
      - name: Typecheck test sources
        working-directory: backend
        run: npm run typecheck:tests
      - name: Run backend unit tests
        working-directory: backend
        run: npm run test
      - name: Generate backend coverage
        working-directory: backend
        run: npm run coverage
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Smoke-test compiled migration assets and PostGIS runtime
        working-directory: backend
        run: npm run smoke:compiled-migrations
      - name: Smoke-test compiled Košice service-area runtime
        working-directory: backend
        run: npm run smoke:compiled-service-area
      - name: Build backend Docker image
        working-directory: backend
        run: docker build --tag p2c-backend-service-area-smoke:${{ github.sha }} .
      - name: Smoke-test packaged service area inside isolated Docker image
        run: docker run --rm --network none --entrypoint node p2c-backend-service-area-smoke:${{ github.sha }} scripts/smoke-compiled-service-area.mjs
      - name: Build production backend image
        run: >-
          docker build --file backend/Dockerfile.production
          --tag production-foundation-backend:${{ github.sha }}
          --build-arg APP_BUILD_SHA=${{ github.sha }} .
      - name: Verify production backend is non-root, runtime-only, and fail-closed without secrets
        run: |
          set -euo pipefail
          image="production-foundation-backend:${{ github.sha }}"
          docker run --rm --network none --entrypoint node "$image" --input-type=module -e '
            import fs from "node:fs";
            if (typeof process.getuid === "function" && process.getuid() === 0) throw new Error("backend runtime is root");
            await import("express");
            await import("multer");
            if (fs.existsSync("node_modules/vite")) throw new Error("dev dependency is present in runtime image");
          '
          set +e
          output="$(docker run --rm --network none -e NODE_ENV=production --entrypoint node "$image" dist/index.js 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'PUBLIC_ORIGIN is required' <<<"$output"
          set +e
          backup_output="$(docker run --rm --network none -e NODE_ENV=production --entrypoint node "$image" dist/scripts/backupDatabase.js 2>&1)"
          backup_status=$?
          set -e
          test "$backup_status" -eq 2
          grep -q '"state":"preflight_rejected"' <<<"$backup_output"
          grep -q 'production_backup_adapter_not_configured' <<<"$backup_output"
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: warn
          retention-days: 14

  sqlfluff:
    name: sqlfluff-report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned SQLFluff
        run: python -m pip install --disable-pip-version-check 'sqlfluff==4.4.0'
      - name: Lint SQL without auto-fix
        run: |
          mapfile -d '' sql_files < <(find database backend/src/db/migrations -type f -name '*.sql' -print0)
          if ((${#sql_files[@]} == 0)); then
            echo 'No SQL files found.' | tee "$RUNNER_TEMP/sqlfluff-lint.txt"
            exit 2
          fi
          status=0
          sqlfluff lint --ignore-local-config --config .sqlfluff "${sql_files[@]}" > "$RUNNER_TEMP/sqlfluff-lint.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/sqlfluff-lint.txt"
          printf '\nSQLFluff exit code: %s\n' "$status" | tee -a "$RUNNER_TEMP/sqlfluff-lint.txt"
          if ((status > 1)); then
            echo 'SQLFluff execution/configuration failure.'
            exit "$status"
          fi
          if ((status == 1)); then
            echo 'SQLFluff rule findings are informational pending baseline triage.'
          fi
      - name: Upload SQLFluff report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlfluff-report
          path: ${{ runner.temp }}/sqlfluff-lint.txt
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: dependency-audit-report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Collect npm audit reports without changing dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/npm-audit"
          set +e
          (cd frontend && npm audit --json > "$RUNNER_TEMP/npm-audit/frontend.json" 2> "$RUNNER_TEMP/npm-audit/frontend.stderr.txt")
          frontend_status=$?
          (cd backend && npm audit --json > "$RUNNER_TEMP/npm-audit/backend.json" 2> "$RUNNER_TEMP/npm-audit/backend.stderr.txt")
          backend_status=$?
          set -e
          printf '{"frontend_exit_code":%s,"backend_exit_code":%s}\n' "$frontend_status" "$backend_status" > "$RUNNER_TEMP/npm-audit/exit-codes.json"
          {
            echo '## npm audit (informational)'
            echo "Frontend exit code: $frontend_status"
            echo "Backend exit code: $backend_status"
            echo 'See the `dependency-audit-report` artifact. Findings do not fail this job until security triage defines a blocking policy.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'npm audit reports collected; no dependency or lockfile changes made.'
      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-report
          path: ${{ runner.temp }}/npm-audit/
          if-no-files-found: warn
          retention-days: 14

  process-egress-research:
    name: process-egress-research
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Resolve the synthetic probe host before isolation
        run: |
          probe_ip="$(getent ahostsv4 example.com | awk 'NR == 1 { print $1 }')"
          test -n "$probe_ip"
          printf 'PROBE_IPV4=%s\n' "$probe_ip" >> "$GITHUB_ENV"
          printf 'CHROME_BIN=%s\n' "$(command -v google-chrome || command -v google-chrome-stable)" >> "$GITHUB_ENV"
      - name: Characterize runner privileges before containment
        env:
          RUNNER_PRIVILEGE_EVIDENCE: ${{ runner.temp }}/runner-privilege-evidence.txt
        run: |
          bash scripts/research/characterize-runner-privileges.sh
      - name: Prove process egress isolation under a privilege-dropped identity
        env:
          PROCESS_EGRESS_EVIDENCE_DIR: ${{ runner.temp }}/process-egress-containment-evidence
        run: |
          sudo -n stat -c 'root-readable helper mode=%a owner=%U:%G path=%n' "$GITHUB_WORKSPACE/scripts/research/contained-workload.sh"
          sudo -n head -n 1 "$GITHUB_WORKSPACE/scripts/research/contained-workload.sh"
          sudo --preserve-env=PROBE_IPV4,CHROME_BIN,PROCESS_EGRESS_EVIDENCE_DIR,RUNNER_OS,RUNNER_TEMP,GITHUB_WORKSPACE,RUNNER_HOST_PID,HOST_NETNS_ID,HOST_USERNS_ID,PATH,CI \
            bash -x "$GITHUB_WORKSPACE/scripts/research/contained-workload.sh" probe
      - name: Upload process egress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: process-egress-research
          path: |
            ${{ runner.temp }}/runner-privilege-evidence.txt
            ${{ runner.temp }}/process-egress-containment-evidence/
          if-no-files-found: warn
          retention-days: 14

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-24.04
    needs: [process-egress-research]
    if: always()
    timeout-minutes: 20
    env:
      DB_HOST: /tmp/p5-e2e-postgres-socket-${{ github.run_id }}
      DB_PORT: '5432'
      DB_NAME: p5_e2e_admin
      DB_USER: p5_e2e_user
      DB_PASSWORD: p5-e2e-synthetic-password
      P5_E2E_ALLOW_DB_RESET: 'true'
      P5_E2E_SOCKET_HOST: /tmp/p5-e2e-postgres-socket-${{ github.run_id }}
      P5_E2E_SOCKET_REL: .p5-e2e-postgres-socket
      JWT_SECRET: p5-e2e-only-jwt-secret-never-used-outside-the-disposable-ci-database
    defaults:
      run:
        shell: bash
    services:
      postgis:
        image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
        command: >-
          postgres -c listen_addresses= -c unix_socket_directories=/var/run/postgresql -c unix_socket_permissions=0777
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: p5_e2e_user
          POSTGRES_PASSWORD: p5-e2e-synthetic-password
        volumes:
          - /tmp/p5-e2e-postgres-socket-${{ github.run_id }}:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -h /var/run/postgresql -U p5_e2e_user -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Report blocked browser run when the process-egress gate fails
        if: needs.process-egress-research.result != 'success'
        run: |
          echo 'BROWSER E2E BLOCKED — PROCESS EGRESS GATE FAILED: privilege-resistant containment was not demonstrated.'
          exit 1
      - name: Checkout
        if: needs.process-egress-research.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create contained workload socket mountpoint
        if: needs.process-egress-research.result == 'success'
        run: install -d -m 0755 "$GITHUB_WORKSPACE/.p5-e2e-postgres-socket"
      - name: Set up Node.js 20
        if: needs.process-egress-research.result == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install frontend dependencies
        if: needs.process-egress-research.result == 'success'
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        if: needs.process-egress-research.result == 'success'
        working-directory: backend
        run: npm ci
      - name: Install Playwright Chromium before network isolation
        if: needs.process-egress-research.result == 'success'
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: npx playwright install chromium
      - name: Prepare disposable PostGIS database with canonical migrations and synthetic fixtures
        if: needs.process-egress-research.result == 'success'
        id: prepare-p5-e2e-db
        working-directory: backend
        env:
          NODE_ENV: test
        run: npm run e2e:prepare-db
      - name: Resolve the synthetic probe host before isolation
        if: needs.process-egress-research.result == 'success'
        run: |
          probe_ip="$(getent ahostsv4 example.com | awk 'NR == 1 { print $1 }')"
          test -n "$probe_ip"
          printf 'PROBE_IPV4=%s\n' "$probe_ip" >> "$GITHUB_ENV"
          printf 'CHROME_BIN=%s\n' "$(command -v google-chrome || command -v google-chrome-stable)" >> "$GITHUB_ENV"
      - name: Characterize this runner before dropping to the E2E workload identity
        if: needs.process-egress-research.result == 'success'
        env:
          RUNNER_PRIVILEGE_EVIDENCE: ${{ runner.temp }}/browser-runner-privilege-evidence.txt
        run: bash scripts/research/characterize-runner-privileges.sh
      - name: Reprove privilege-resistant isolation and run browser E2E in that containment
        if: needs.process-egress-research.result == 'success'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          PROCESS_EGRESS_EVIDENCE_DIR: ${{ runner.temp }}/browser-egress-containment-evidence
          DB_HOST: /tmp/p5-e2e-postgres-socket-${{ github.run_id }}
          DB_PORT: '5432'
          DB_NAME: p5_e2e_admin
          DB_USER: p5_e2e_user
          DB_PASSWORD: p5-e2e-synthetic-password
          P5_E2E_ALLOW_DB_RESET: 'true'
          P5_E2E_SOCKET_HOST: /tmp/p5-e2e-postgres-socket-${{ github.run_id }}
          P5_E2E_SOCKET_REL: .p5-e2e-postgres-socket
          JWT_SECRET: p5-e2e-only-jwt-secret-never-used-outside-the-disposable-ci-database
        run: |
          sudo --preserve-env=PROBE_IPV4,CHROME_BIN,PROCESS_EGRESS_EVIDENCE_DIR,RUNNER_OS,RUNNER_TEMP,GITHUB_WORKSPACE,GITHUB_RUN_ID,RUNNER_HOST_PID,HOST_NETNS_ID,HOST_USERNS_ID,PATH,CI,PLAYWRIGHT_BROWSERS_PATH,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,P5_E2E_ALLOW_DB_RESET,P5_E2E_SOCKET_HOST,P5_E2E_SOCKET_REL,JWT_SECRET \
            bash "$GITHUB_WORKSPACE/scripts/research/contained-workload.sh" browser
      - name: Upload synthetic browser, axe, request-ledger, trace, and egress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
            ${{ runner.temp }}/browser-egress-containment-evidence/
            ${{ runner.temp }}/browser-runner-privilege-evidence.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Clean synthetic fixtures from the disposable PostGIS database
        if: always() && steps.prepare-p5-e2e-db.outcome == 'success'
        working-directory: backend
        env:
          NODE_ENV: test
        run: npm run e2e:cleanup-db
