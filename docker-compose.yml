services:
  db:
    image: postgres:16-alpine
    container_name: lighting-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lighting_faults}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lighting_faults}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: lighting-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOCAL_TEST_SUBMIT_ENABLED: ${LOCAL_TEST_SUBMIT_ENABLED:-false}
      LOCAL_TEST_MAX_FILE_BYTES: ${LOCAL_TEST_MAX_FILE_BYTES:-10485760}
      LOCAL_TEST_MAX_FILES: ${LOCAL_TEST_MAX_FILES:-3}
      LOCAL_TEST_MAX_TOTAL_UPLOAD_BYTES: ${LOCAL_TEST_MAX_TOTAL_UPLOAD_BYTES:-20971520}
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lighting_faults}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      AUSEMIO_BASE_URL: ${AUSEMIO_BASE_URL:-https://kosice.ausemio.io/public_issues}
      AUSEMIO_API_KEY: ${AUSEMIO_API_KEY:-}
      AUSEMIO_TEST_MODE: ${AUSEMIO_TEST_MODE:-true}
      AUSEMIO_LOCALE: ${AUSEMIO_LOCALE:-sk}
      NOMINATIM_AUTO_GEOCODE: ${NOMINATIM_AUTO_GEOCODE:-false}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-PublicLightingFaultReporting/1.0}
      NOMINATIM_ACCEPT_LANGUAGE: ${NOMINATIM_ACCEPT_LANGUAGE:-sk}
      NOMINATIM_MIN_INTERVAL_MS: ${NOMINATIM_MIN_INTERVAL_MS:-1100}
      GEOAPIFY_ENABLED: ${GEOAPIFY_ENABLED:-false}
      GEOAPIFY_BASE_URL: ${GEOAPIFY_BASE_URL:-https://api-eu.geoapify.com}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEOAPIFY_TIMEOUT_MS: ${GEOAPIFY_TIMEOUT_MS:-3000}
      GEOAPIFY_MAX_ACTIVE: ${GEOAPIFY_MAX_ACTIVE:-1}
      GEOAPIFY_MAX_PENDING: ${GEOAPIFY_MAX_PENDING:-1}
      GEOAPIFY_START_INTERVAL_MS: ${GEOAPIFY_START_INTERVAL_MS:-250}
      GEOAPIFY_QUEUE_EXPIRY_MS: ${GEOAPIFY_QUEUE_EXPIRY_MS:-4000}
      GEOAPIFY_DAILY_BUDGET: ${GEOAPIFY_DAILY_BUDGET:-2700}
      ADDRESS_IP_BUCKET_BURST: ${ADDRESS_IP_BUCKET_BURST:-10}
      ADDRESS_IP_REFILL_PER_MINUTE: ${ADDRESS_IP_REFILL_PER_MINUTE:-30}
      ADDRESS_IP_MAX_KEYS: ${ADDRESS_IP_MAX_KEYS:-8192}
      ADDRESS_IP_IDLE_TTL_MS: ${ADDRESS_IP_IDLE_TTL_MS:-120000}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: lighting-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
      VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH:-/panel-svietidla}
      VITE_MAP_TILE_PROVIDER: ${VITE_MAP_TILE_PROVIDER:-disabled}
      VITE_CARTO_TILES_APPROVED: ${VITE_CARTO_TILES_APPROVED:-false}
      VITE_CARTO_PUBLIC_KEY: ${VITE_CARTO_PUBLIC_KEY:-}
      VITE_ALLOW_DEVICE_MAP_RECENTER: ${VITE_ALLOW_DEVICE_MAP_RECENTER:-false}
    depends_on:
      - backend

volumes:
  pgdata:
