worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;

  client_max_body_size 6m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;
  proxy_connect_timeout 3s;
  proxy_send_timeout 30s;
  proxy_read_timeout 60s;

  upstream lighting_backend { server backend:5000; keepalive 16; }
  upstream local_email_inbox { server backend:5001; keepalive 4; }
  upstream public_static { server public-app:8080; keepalive 8; }
  upstream admin_static { server admin-app:8080; keepalive 8; }

  server {
    listen 8080 default_server;
    server_name localhost _;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    include /etc/nginx/snippets/local-uat-edge-routes.conf;
  }

  server {
    listen 8443 ssl;
    server_name localhost _;
    ssl_certificate /etc/nginx/ssl/local-uat-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/local-uat-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:local_uat_tls:1m;
    ssl_session_timeout 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    include /etc/nginx/snippets/local-uat-edge-routes.conf;
  }
}
