location = /panel-svietidla { return 308 /panel-svietidla/; }
location = /fake-inbox { return 404; }
location ^~ /fake-inbox/ { return 404; }

location ^~ /panel-svietidla/ {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_pass http://admin_static/;
}

location ^~ /api/ {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host 127.0.0.1:5000;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_pass http://lighting_backend;
}

location / {
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_pass http://public_static;
}
