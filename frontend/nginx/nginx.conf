worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;

  client_body_temp_path /var/cache/nginx/client_temp 1 2;
  proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
  client_max_body_size 6m;
  client_body_buffer_size 128k;
  client_body_timeout 15s;
  client_header_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 15s;

  proxy_connect_timeout 3s;
  proxy_send_timeout 30s;
  proxy_read_timeout 60s;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 10m;

  upstream lighting_backend {
    server backend:5000;
    keepalive 16;
  }

  upstream public_static {
    server public-app:8080;
    keepalive 16;
  }

  upstream admin_static {
    server admin-app:8080;
    keepalive 16;
  }

  server {
    listen 8080 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    return 444;
  }

  server {
    listen 8080;
    server_name mapa.vra-ubuntu-server-0579.virtual.cloud.tuke.sk;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name mapa.vra-ubuntu-server-0579.virtual.cloud.tuke.sk;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/snippets/security-headers.conf;
      return 404;
    }
    location = /api/health { include /etc/nginx/snippets/api-proxy.conf; }
    location = /api/light-points { include /etc/nginx/snippets/api-proxy.conf; }
    location ^~ /api/light-points/ { include /etc/nginx/snippets/api-proxy.conf; }
    location = /api/reports/address-suggestion { include /etc/nginx/snippets/api-proxy.conf; }
    location ^~ /api/ {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/snippets/security-headers.conf;
      return 404;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://public_static;
    }
  }

  server {
    listen 8080;
    server_name admin.mapa.vra-ubuntu-server-0579.virtual.cloud.tuke.sk;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    server_name admin.mapa.vra-ubuntu-server-0579.virtual.cloud.tuke.sk;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/snippets/security-headers.conf;
      return 404;
    }
    location = /api/health { include /etc/nginx/snippets/api-proxy.conf; }
    location = /api/admin { include /etc/nginx/snippets/api-proxy.conf; }
    location ^~ /api/admin/ { include /etc/nginx/snippets/api-proxy.conf; }
    location ^~ /api/ {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/snippets/security-headers.conf;
      return 404;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://admin_static;
    }
  }
}
